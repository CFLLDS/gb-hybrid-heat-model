<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hybrid House: three winter days</title>
<meta name="description" content="The monitored Poole house run as a hybrid, heat pump and gas boiler, through three real days of 2010-11 priced on 2025-26: when each controller switches, what it costs, and the rooms.">
<style>/* LDS brand (ldsconsultancy.com, read 28 Oct 2026): forest #1F4D3C / deep #123328, gold #C4993A, leaf #97BC62,
   sage #C8D4CE, slate #55605A; Calibri bold. The house is the lantern: gold heat on a forest-green night. */
:root {
  --night: #0D261C;
  --deep: #123328;
  --forest: #1F4D3C;
  --gold: #C4993A;
  --amber: #E8A33D;
  --leaf: #97BC62;
  --sage: #C8D4CE;
  --slate: #55605A;
  --plaster: #EEF3EF;
  --ink: #EEF3EF;
  --muted: #A9BDB3;
  --gas: #9A8FBF;
  --line: rgba(238, 243, 239, 0.18);
  --face: Calibri, Carlito, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--deep);
  color: var(--ink);
  font-family: var(--face);
  font-size: 17px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
}

.top {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: end;
  gap: 28px;
  padding: 28px 40px 18px;
}
.logo { height: 54px; width: auto; align-self: center; }
.title h1 {
  margin: 0;
  font-size: clamp(34px, 4.6vw, 64px);
  line-height: 1;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.title .sub { margin: 8px 0 0; color: var(--leaf); font-style: italic; font-size: 19px; max-width: 62ch; }

.modes { display: flex; gap: 8px; }
.modes button, .transport button {
  font: 700 15px var(--face);
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--ink);
  padding: 10px 18px;
  cursor: pointer;
}
.modes button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--deep); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--leaf); outline-offset: 2px; }

.stage {
  display: grid;
  grid-template-columns: minmax(0, 2.1fr) minmax(280px, 1fr);
  gap: 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.scene { background: var(--night); position: relative; }
#house { display: block; width: 100%; height: auto; }
.cap { margin: 0; padding: 10px 24px 14px; color: var(--muted); font-size: 14px; }

.read { background: var(--forest); padding: 26px 30px; }
#readouts { margin: 0; display: grid; gap: 20px; }
#readouts div { border-top: 1px solid var(--line); padding-top: 12px; }
#readouts dt { color: var(--sage); font-size: 15px; }
#readouts dd { margin: 2px 0 0; font-size: clamp(28px, 2.9vw, 42px); font-weight: 700; line-height: 1.05; }
#readouts dd small { display: block; font-size: 15px; font-weight: 400; color: var(--muted); margin-top: 4px; }
#readouts .gold { color: var(--amber); }
#readouts .leaf { color: var(--leaf); }
#readouts .gas { color: var(--gas); }
#readouts dd.txt { font-size: clamp(22px, 2vw, 28px); line-height: 1.15; }

.controls { padding: 24px 40px 8px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 36px; }
.controls[hidden] { display: none; }
.sliders { display: grid; gap: 14px; align-content: start; }
.slider label { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
.slider output { color: var(--amber); }
.slider small { color: var(--muted); font-size: 13px; }
input[type=range] { width: 100%; accent-color: var(--gold); height: 28px; }
.choice { display: flex; gap: 8px; flex-wrap: wrap; }
.choice button {
  font: 15px var(--face); color: var(--ink); background: transparent; border: 1px solid var(--line);
  padding: 7px 12px; cursor: pointer;
}
.choice button[aria-pressed="true"] { border-color: var(--gold); color: var(--amber); font-weight: 700; }
.curve { margin: 0; }
.curve svg { width: 100%; height: auto; display: block; }
figcaption { color: var(--muted); font-size: 14px; margin-top: 6px; }

#playout-controls { grid-template-columns: 1fr; gap: 12px; }
.transport { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.transport label { display: flex; align-items: center; gap: 8px; color: var(--sage); }
.transport select { font: 15px var(--face); background: var(--forest); color: var(--ink); border: 1px solid var(--line); padding: 8px; }
.day { margin: 0 0 0 auto; font-size: 26px; font-weight: 700; color: var(--amber); }
#timeline { width: 100%; height: auto; display: block; }

.basis { padding: 18px 40px 36px; border-top: 1px solid var(--line); margin-top: 18px; }
.basis h2 { font-size: 20px; margin: 0 0 10px; }
.basis ul { margin: 0; padding-left: 18px; columns: 2 420px; column-gap: 40px; color: var(--sage); font-size: 15px; }
.basis li { margin-bottom: 6px; break-inside: avoid; }
.basis li b { color: var(--ink); }
.small { color: var(--muted); font-size: 13px; }

svg text { font-family: var(--face); }

@media (max-width: 900px) {
  .top { grid-template-columns: 1fr; padding: 20px 16px 12px; gap: 12px; }
  .stage { grid-template-columns: 1fr; }
  .controls { grid-template-columns: 1fr; padding: 18px 16px 8px; }
  .basis { padding: 16px; }
  .read { padding: 20px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .fan { animation: none !important; }
}
@keyframes spin { to { transform: rotate(360deg); } }
.fan.on { animation: spin 0.9s linear infinite; transform-box: fill-box; transform-origin: center; }

/* the verdict at the end of a four-day run, held over the drawing before it loops */
.verdict {
  position: absolute; inset: 0; display: grid; align-content: center; justify-items: start; gap: 6px;
  padding: 6% 8%; background: rgba(13, 38, 28, 0.9); animation: rise 0.8s ease-out both;
}
.verdict[hidden] { display: none; }
.verdict p { margin: 0; }
.v-lead { color: var(--leaf); font-size: clamp(18px, 1.8vw, 26px); font-style: italic; }
.v-hp span, .v-gas span { font-size: clamp(56px, 8vw, 120px); font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
.v-hp span { color: var(--amber); }
.v-gas span { color: var(--gas); font-size: clamp(34px, 4.5vw, 64px); }
.v-hp small, .v-gas small { display: block; color: var(--sage); font-size: clamp(16px, 1.5vw, 22px); margin-bottom: 14px; }
.v-save { font-size: clamp(22px, 2.4vw, 34px); font-weight: 700; color: var(--ink); border-top: 2px solid var(--gold); padding-top: 12px; }
.v-all { font-size: clamp(16px, 1.4vw, 20px); color: var(--sage); max-width: 60ch; }
#readouts { gap: 14px; }
#readouts div { padding-top: 9px; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .verdict { animation: none; } }

/* kiosk: #kiosk -- the four-day playout, nothing to press, no cursor */
.kiosk { cursor: none; }
.kiosk .modes, .kiosk .transport button, .kiosk .transport label, .kiosk .basis { display: none; }
.kiosk #playout-controls { padding-top: 14px; }

/* heat on the move: the flow pipe pulses, a haze leaves through roof and walls in proportion to the loss */
@keyframes pulse { to { stroke-dashoffset: -28; } }
.flow { stroke-dasharray: 10 4; animation: pulse 0.8s linear infinite; }
@keyframes rise-off { from { transform: translateY(0); opacity: 0.9; } to { transform: translateY(-14px); opacity: 0; } }
.haze { animation: rise-off 3.2s ease-out infinite; }
/* the caption for the moment */
.event {
  margin: 0; padding: 12px 24px 0 20px; border-left: 4px solid var(--gold); margin-left: 24px; margin-top: 12px;
  font-size: clamp(18px, 1.6vw, 24px); font-weight: 700; color: var(--ink); min-height: 1.4em;
}
.event:empty { display: none; }
.event.show { animation: rise 0.6s ease-out both; }
@media (prefers-reduced-motion: reduce) { .flow, .haze, .event.show { animation: none; } }

/* A real day */
#replay-controls { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr); }
.replay-pick { display: grid; gap: 14px; align-content: start; }
.scrub { display: flex; justify-content: space-between; font-weight: 700; margin-top: 6px; }
.scrub output { color: var(--amber); }
#house.nobatt .batt { display: none; }

/* the 2.5D scene is the hero; the flat section is one press away */
#house3d { display: block; width: 100%; height: auto; }
#house3d[hidden], #house[hidden] { display: none; }
.viewtoggle {
  position: absolute; left: 16px; top: 16px; font: 700 14px var(--face); color: var(--ink);
  background: rgba(13, 38, 28, 0.75); border: 1px solid var(--line); padding: 7px 12px; cursor: pointer;
}
.kiosk .viewtoggle { display: none; }
#house3d.nobatt .batt { display: none; }

/* temperature and daylight fade rather than jump */
.tint { transition: fill 0.9s linear, stroke 0.9s linear; }
#house stop, #house3d stop { transition: stop-color 1.2s linear; }
@media (prefers-reduced-motion: reduce) { .tint, #house stop, #house3d stop { transition: none; } }
/* the plain-English line: what a household could do with what the twin shows */
.advice { margin: 22px 0 0; padding: 12px 0 0 16px; border-left: 4px solid var(--leaf); color: var(--ink); font-size: 17px; line-height: 1.4; }
.advice:empty { display: none; }
.advice b { color: var(--leaf); }

/* a 720p projector: keep the house and the numbers on one screen */
@media (min-width: 901px) and (max-height: 820px) {
  .top { padding: 14px 32px 10px; gap: 20px; align-items: center; }
  .logo { height: 40px; }
  .title h1 { font-size: 40px; }
  .title .sub { font-size: 16px; margin-top: 4px; }
  .read { padding: 16px 24px; }
  #readouts { gap: 8px; }
  #readouts div { padding-top: 6px; }
  #readouts dd { font-size: 28px; }
  #readouts dd small { font-size: 13px; margin-top: 2px; }
  #readouts dd.txt { font-size: 20px; }
  .advice { margin-top: 12px; font-size: 15px; }
}

/* the grid line: export flows the other way */
.flow.rev { animation-direction: reverse; }
.v-co2 { font-size: clamp(18px, 1.8vw, 26px); font-weight: 700; color: var(--leaf); }
.v-car { font-size: clamp(16px, 1.4vw, 20px); color: var(--ink); max-width: 64ch; }
@media (min-width: 901px) and (max-height: 820px) {
  body[data-mode="playout"] .advice { display: none; }     /* the playout's line is static; the numbers need the room */
  .verdict { padding: 3% 6%; gap: 2px; }
  .v-hp span { font-size: 76px; }
  .v-gas span { font-size: 44px; }
  .v-hp small, .v-gas small { font-size: 16px; margin-bottom: 6px; }
  .v-save { font-size: 24px; padding-top: 8px; }
  .v-co2 { font-size: 18px; }
  .v-car, .v-all { font-size: 15px; }
}

/* Hybrid edition, layered over assets/testbed/style.css. Heat pump blue, boiler green (the article's colours). */
:root { --hp: #2a78d6; --gasb: #1baf7a; }
.hy .top { grid-template-columns: auto 1fr; padding: 18px 32px 12px; }
.hy .title h1 { font-size: clamp(28px, 3.4vw, 50px); }
.hy .title .sub { font-size: 17px; max-width: none; margin-top: 4px; }
.hy .stage { grid-template-columns: minmax(0, 2.25fr) minmax(300px, 1fr); }
.hy #house3d, .hy #house { max-height: calc(100vh - 460px); min-height: 300px; margin: 0 auto; }
.hy .scene { display: flex; flex-direction: column; justify-content: center; }

/* clock and the source, over the drawing */
.clock { position: absolute; right: 18px; top: 14px; text-align: right; pointer-events: none; }
.clock span { display: block; color: var(--sage); font-size: 15px; }
.clock b { font-size: clamp(30px, 3vw, 48px); line-height: 1; color: var(--ink); }
.srcbadge { position: absolute; right: 18px; top: 84px; display: grid; justify-items: end; gap: 4px; pointer-events: none;
  background: rgba(13, 38, 28, 0.72); padding: 8px 12px; border: 1px solid var(--line); }
.srcbadge .lab { color: var(--sage); font-size: 13px; }
.srcbadge .bar { display: flex; width: 150px; height: 10px; background: #2E3B37; }
.srcbadge .bar i { display: block; height: 100%; transition: width 0.5s linear; }
.srcbadge .bar .hp, .tk .dot.hp { background: var(--hp); }
.srcbadge .bar .gas, .tk .dot.gas { background: var(--gasb); }
.srcbadge b { font-size: 20px; }
.srcbadge b.hp, #readouts dd.hp { color: #6FA8EE; }
.srcbadge b.gas, #readouts dd.gas { color: #3FD39C; }
.srcbadge b.both, #readouts dd.both { background: linear-gradient(90deg, #6FA8EE, #3FD39C); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* the cutover, impossible to miss */
.flash { position: absolute; right: 18px; top: 190px; display: grid; justify-items: center; gap: 6px; min-width: 210px;
  padding: 12px 16px; background: rgba(13, 38, 28, 0.92); border: 2px solid var(--gold); pointer-events: none; white-space: nowrap; }
.flash[hidden] { display: none; }
.flash .ft { color: var(--sage); font-size: clamp(16px, 1.5vw, 24px); font-weight: 700; }
.flash .fa { font-size: clamp(20px, 2vw, 34px); font-weight: 700; padding: 2px 12px; color: #fff; }
.flash .fa.hp { background: var(--hp); } .flash .fa.gas { background: var(--gasb); }
.flash .fa.both { background: linear-gradient(90deg, var(--hp) 50%, var(--gasb) 50%); }
.flash .arr { font-size: clamp(24px, 2.4vw, 40px); line-height: 1; color: var(--gold); font-weight: 700; transform: rotate(90deg); }
.flash.show { animation: pop 0.45s ease-out both; }
@keyframes pop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: none; } }

/* boiler flame and plume, pipes that share the load */
@keyframes puff { from { transform: translate(0, 0) scale(0.6); opacity: 0.85; } to { transform: translate(-6px, -46px) scale(1.9); opacity: 0; } }
.puff { animation: puff 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes flick { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.82); } }
.flame { animation: flick 0.35s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
.stripe { stroke-dasharray: 12 12; animation: pulse 0.8s linear infinite; }
@media (prefers-reduced-motion: reduce) { .puff, .flame, .stripe, .flash.show { animation: none; } }

/* right-hand panel */
.hy .read { padding: 18px 22px; display: grid; gap: 12px; align-content: start; }
.whoami { margin: 0; color: var(--sage); font-size: 16px; }
.whoami b { color: var(--amber); font-size: 20px; }
.hy #readouts { gap: 8px 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.hy #readouts div { padding-top: 6px; }
.hy #readouts dd { font-size: clamp(22px, 1.7vw, 30px); }
.hy #readouts dd small { font-size: 13px; margin-top: 2px; line-height: 1.25; }
.hy #readouts dt { font-size: 14px; }
.tickers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tk { border: 1px solid var(--line); padding: 8px 10px; display: flex; flex-direction: column; position: relative; background: rgba(13, 38, 28, 0.35); }
.tk.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.tk b { font-size: 15px; line-height: 1.15; padding-right: 14px; }
.tk small { color: var(--muted); font-size: 12px; }
.tk .p { font-size: clamp(22px, 1.8vw, 30px); font-weight: 700; color: var(--ink); margin-top: 4px; }
.tk.on .p { color: var(--amber); }
.tk .g { font-size: 14px; color: var(--leaf); }
.tk .dot { position: absolute; right: 8px; top: 10px; width: 10px; height: 10px; border-radius: 50%; }
.tk .dot.both { background: linear-gradient(90deg, var(--hp) 50%, var(--gasb) 50%); }
.tickers .ref { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 13px; }
.gbin { margin: 0; }
.gbin svg { width: 100%; height: auto; display: block; }
.gbin figcaption { margin-top: 2px; font-size: 13px; color: var(--sage); }
.gbin .kcc { color: var(--amber); font-weight: 700; } .gbin .ksd { color: #EEF3EF; font-weight: 700; } .gbin .kphi { color: var(--gold); }
#gb .gcapt { fill: var(--sage); }
#gb .gl { stroke: rgba(238, 243, 239, 0.1); } #gb .gt { fill: var(--muted); font-size: 11px; }
#gb .gcap { stroke: var(--sage); stroke-dasharray: 5 4; }
#gb .gcc { fill: none; stroke: var(--amber); stroke-width: 2.5; } #gb .gsd { fill: none; stroke: #EEF3EF; stroke-width: 2.5; }
#gb .ghost { opacity: 0.18; } #gb .gphi { fill: var(--gold); } #gb .gphi.ghost { opacity: 0.25; }
#gb .ghead { stroke: rgba(238, 243, 239, 0.4); } #gb .gccd { fill: var(--amber); } #gb .gsdd { fill: #EEF3EF; }

/* caption for the moment, full width under the stage */
.hy .event { margin: 12px 32px 0; padding: 8px 0 8px 18px; font-size: clamp(18px, 1.5vw, 24px); min-height: 2.2em; max-width: 120ch; }
.hy .event:empty { display: block; }
.hy .cap { padding: 4px 32px 0; }

/* controls */
.hyc { grid-template-columns: 1fr; gap: 8px; padding: 10px 32px 4px; }
.hyc .pick { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.hyc .grp { display: flex; align-items: center; gap: 10px; }
.hyc .grp > span { color: var(--sage); font-size: 14px; }
.hyc .transport .scrub { flex: 1; min-width: 200px; }
.hyc .transport .scrub input { flex: 1; }
#lanes { width: 100%; height: auto; display: block; cursor: pointer; }
#lanes .lt { fill: var(--muted); font-size: 13px; } #lanes .lt.on { fill: var(--amber); font-weight: 700; }
#lanes .lprice { fill: none; stroke: var(--amber); stroke-width: 1.5; } #lanes .lzero { stroke: var(--sage); stroke-dasharray: 3 3; }
#lanes .lhp { fill: var(--hp); } #lanes .lgas { fill: var(--gasb); } #lanes .lphi { fill: var(--gold); }
#lanes .lhead { stroke: #EEF3EF; stroke-width: 2; }

/* the day's verdict */
.hyv { justify-items: stretch; padding: 4% 6%; gap: 10px; }
.hyv .v-lead { font-size: clamp(18px, 1.7vw, 26px); }
.v-rows { display: grid; gap: 6px; }
.v-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); align-items: baseline; gap: 12px; border-top: 1px solid var(--line); padding-top: 6px; }
.v-row .n { font-size: clamp(18px, 1.7vw, 26px); font-weight: 700; }
.v-row .n small { display: block; font-size: 14px; font-weight: 400; color: var(--muted); }
.v-row .p { font-size: clamp(30px, 3.4vw, 54px); font-weight: 700; line-height: 1; }
.v-row .g { font-size: clamp(18px, 1.7vw, 26px); color: var(--leaf); font-weight: 700; }
.v-row.on .p { color: var(--amber); } .v-row.on .n { color: var(--amber); }
.v-row.ref { opacity: 0.7; } .v-row.ref .p { font-size: clamp(22px, 2.2vw, 34px); }
.hyv .v-save { font-size: clamp(18px, 1.8vw, 28px); }
.v-warm { font-size: clamp(16px, 1.4vw, 21px); color: var(--ink); max-width: 70ch; }
.v-gb { font-size: clamp(15px, 1.2vw, 18px); color: var(--sage); }

/* kiosk: nothing to press, captions large, the whole day on one 1080p frame */
.kiosk .hyc, .kiosk .basis, .kiosk .viewtoggle { display: none; }
.kiosk .top { padding: 12px 32px 8px; }
.kiosk .title h1 { font-size: 40px; }
.kiosk .event { font-size: clamp(22px, 1.9vw, 32px); min-height: 2.8em; }
.kiosk #house3d, .kiosk #house { max-height: calc(100vh - 205px); }

@media (max-width: 900px) {
  .hy .top { padding: 14px 16px 10px; grid-template-columns: 1fr; gap: 8px; }
  .hy .logo { height: 36px; justify-self: start; }
  .hy .title h1 { font-size: 28px; }
  .hy .title .sub { font-size: 15px; }
  .hy .stage { grid-template-columns: 1fr; }
  .hy .scene { display: block; }
  .hy #house3d, .hy #house { max-height: none; min-height: 0; }
  .clock { right: 10px; top: 8px; } .clock b { font-size: 26px; } .clock span { font-size: 12px; }
  .srcbadge { position: static; display: flex; align-items: center; gap: 10px; justify-content: flex-start; border: 0; padding: 8px 16px; background: transparent; } .srcbadge .bar { width: 100px; } .srcbadge b { font-size: 15px; }
  .hy .viewtoggle { display: none; }
  .flash { top: 44px; right: auto; left: 50%; transform: translateX(-50%); display: flex; min-width: 0; gap: 8px; padding: 8px 12px; }
  .flash .arr { transform: none; }
  .flash.show { animation: none; } .flash .fa { font-size: 17px; padding: 2px 6px; } .flash .arr { font-size: 18px; } .flash .ft { font-size: 13px; }
  .hy .event { margin: 10px 16px 0; font-size: 17px; }
  .hy .cap { padding: 4px 16px 0; }
  .hyc { padding: 12px 16px 4px; }
  .hy .read { padding: 14px 16px; }
  .tk { padding: 6px 7px; } .tk b { font-size: 13px; } .tk .p { font-size: 20px; } .tk .g { font-size: 12px; } .tk small { font-size: 11px; }
  .hyv { position: static; padding: 16px; }
  .v-row .p { font-size: 26px; }
}
</style>
</head>

/* The house model behind TestbedDT. Pure functions over P (the measured parameters the builder bakes in from
   config/heatloss.json, state/room_decay.json, config/radiators.json and the floor plans). kW, kWh, hours, C.
   Anything that is an assumption rather than a fit is named ASSUMED here and listed on the page. */
"use strict";

const TWIN = (() => {
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // The controller's weather curve, read off the Daikin 28 Oct 2026: 46 C at -1 C outside, 25 C at 21 C, plus the
  // offset; the target never goes below 25 C.
  function flowTemp(tout, offset) {
    const c = P.curve;
    const t = clamp(tout, c.cold_out, c.warm_out);
    const base = c.cold_lw - (c.cold_lw - c.warm_lw) * (t - c.cold_out) / (c.warm_out - c.cold_out);
    return Math.max(c.floor, base + offset);
  }

  // Measured COP by outdoor band (two winters, 1,372 h). Water warmer than the house's usual curve costs COP:
  // ASSUMED 2.5 % per K, the usual rule of thumb for this size of unit.
  function cop(tout, offset) {
    const b = P.cop_bands.find(x => tout >= x.lo && tout < x.hi)
      || (tout < P.cop_bands[0].lo ? P.cop_bands[0] : P.cop_bands[P.cop_bands.length - 1]);
    const dLw = flowTemp(tout, offset) - flowTemp(tout, P.curve.offset);
    return b.cop * (1 - 0.025 * dLw);

  // --- Explore: a steady day ----------------------------------------------------------------------------------
  // sun 0..1 = dull..bright. gains_w is a 24 h figure that already holds an average day's sun, so the slider moves

  // times the PV the day would make (ASSUMED winter range 1-12 kWh for the Giv arrays).

"use strict";

    el("text", { x: 4, y: 22, class: "lt" }, svg).textContent = `Price, ${TARN[st.tar]}`;
    el("path", { d: pr.map((v, s) => `${s ? "L" : "M"}${LX(s).toFixed(1)} ${PY(v).toFixed(1)} H${LX(s + 1).toFixed(1)}`).join(" "), class: "lprice" }, svg);
    if (pmin < 0) el("line", { x1: LX(0), x2: LX(48), y1: PY(0), y2: PY(0), class: "lzero" }, svg);
    CTL.forEach(([c, name], k) => {
      const y = 36 + k * 24;
      el("text", { x: 4, y: y + 14, class: "lt" + (c === st.ctl ? " on" : "") }, svg).textContent = name;
      SER[c].forEach((o, s) => {
        const w = (LW - 190) / 48 - 1.5;
        el("rect", { x: LX(s), y, width: w, height: 18, class: "lgas" }, svg);
        if (o.f > 0) el("rect", { x: LX(s), y: y + 18 * (1 - o.f), width: w, height: 18 * o.f, class: "lhp" }, svg);
        if (c === "sdp" && d.phi[st.tar][s] > 0) el("rect", { x: LX(s), y: y - 3, width: w, height: 2, class: "lphi" }, svg);
      });
    });
    [0, 12, 24, 36, 48].forEach(s => el("text", { x: LX(s), y: 120, class: "lt", "text-anchor": s === 48 ? "end" : "middle" }, svg).textContent = s === 48 ? "24:00" : fmtT(s / 2));
    drawLanes.head = el("line", { y1: 4, y2: 108, class: "lhead" }, svg);
    svg.onclick = e => { const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 960;
      if (x >= LX(0)) { st.pos = Math.max(0, Math.min(ROWS, (x - LX(0)) / ((LW - 190) / 48) * 3)); st.slot = -1; st.hold = 0; $("verdict").hidden = true; paint(true); narrateSeek(); } };
  }
  function playhead(row) { const x = LX(row / 3).toFixed(1); drawLanes.head?.setAttribute("x1", x); drawLanes.head?.setAttribute("x2", x); }
  function narrateSeek() { $("flash").hidden = true; const s = Math.min(47, Math.floor(st.pos / 3)); if (s === 0) intro(); else say(`${SRC[SER[st.ctl][s].src]} now. Press play to run on from here.`, s); }

  // ---- the verdict, end of each day ---------------------------------------------------------------------------
  function verdict() {
    const d = TRACE.days[st.day], tw = TW[st.day], t = st.tar, v = $("verdict");
    const rows = CTL.map(([c, name, sub]) => [c, name, sub, d.day_cost_p[t][c], d.day_kg[t][c]]);
    const best = rows.reduce((a, b) => (b[3] < a[3] ? b : a));
    let gbLine = "";
    if (d.gb) { const g = d.gb[t], pk = a => Math.max(...a.map((x, i) => g.base_gw[i] + x));
      gbLine = `<p class="v-gb">Britain's evening peak with every gas home on C-COP: <b>${pk(g.ccop_gw).toFixed(0)} GW</b>; under SD-Power: <b>${pk(g.sdp_gw).toFixed(0)} GW</b>.</p>`; }
    v.innerHTML = `<p class="v-lead">${nice(d.date, { day: "numeric", month: "long", year: "numeric" })} · ${TARN[t]} · the whole day</p>`
      + `<div class="v-rows">${rows.map(([c, name, sub, p, kg]) => `<div class="v-row${c === st.ctl ? " on" : ""}"><span class="n">${name}<small>${sub}</small></span><span class="p">${gbp(p)}</span><span class="g">${kg.toFixed(1)} kg CO₂</span></div>`).join("")}`
      + `<div class="v-row ref"><span class="n">Boiler alone<small>no heat pump</small></span><span class="p">${gbp(d.day_cost_p[t].gas)}</span><span class="g">${d.day_kg[t].gas.toFixed(1)} kg CO₂</span></div></div>`
      + `<p class="v-save">Cheapest today: ${best[1]}.</p>`
      + `<p class="v-warm">Rooms ${tw.lo.toFixed(1)}–${tw.hi.toFixed(1)} °C all day, the same under every controller: the controller changes how the heat is made, never whether the house is warm.</p>`
      + gbLine;
    v.hidden = false;
  }

  // ---- the clock --------------------------------------------------------------------------------------------
  let rafId = 0;
  function frame(ts) {
    rafId = requestAnimationFrame(frame);
    const dt = Math.min(0.1, (ts - (st.last || ts)) / 1000); st.last = ts;
    if (!st.playing) return;
    if (st.hold > 0) {
      st.hold -= dt;
      if (st.hold <= 0) { const i = TRACE.order.indexOf(st.day); setDay(TRACE.order[(i + 1) % TRACE.order.length]); }
      return;
    }
    if (st.dwell > 0) { st.dwell -= dt; return; }
    st.pos = Math.min(ROWS, st.pos + dt * +$("speed").value * 3);
    paint(false);
    if (st.pos >= ROWS) { verdict(); st.hold = kiosk() ? 9 : 8; }
  }
  $("play").onclick = () => { st.playing = !st.playing; controls(); };
  $("scrub").oninput = e => { st.pos = +e.target.value; st.slot = -1; st.hold = 0; st.playing = false; $("verdict").hidden = true; controls(); paint(true); narrateSeek(); };
  $("full").onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
  $("viewtoggle").addEventListener("click", e => {
    const flat = e.currentTarget.getAttribute("aria-pressed") !== "true";
    e.currentTarget.setAttribute("aria-pressed", flat); e.currentTarget.textContent = flat ? "3D view" : "Section view";
    $("house").toggleAttribute("hidden", !flat); $("house3d").toggleAttribute("hidden", flat);
  });

  // ---- basis --------------------------------------------------------------------------------------------------
  const tw0 = TW[TRACE.order[0]], dt0 = TRACE.days[TRACE.order[0]];
  $("basis").innerHTML = [
    `<b>The days</b>: real weather in ${TRACE.town}, ${TRACE.order.map(k => nice(TRACE.days[k].date, { day: "numeric", month: "short", year: "numeric" })).join(", ")}, chosen by rule: ${TRACE.order.map(k => WHY[k]).join("; ")}. Prices are the same calendar days of 2025–26.`,
    `<b>Heat, sources, cost and carbon</b>: half-hour by half-hour from the article's national model run on this house (heat loss 171.7 W per degree), the same physics and controllers as every home in it. The heat pump's share of a half-hour = its electricity × COP ÷ the heat; the boiler makes the rest at ${Math.round(EFF * 100)} %, gas at ${TRACE.gas_p}p a kWh, ${TRACE.gas_kg} kg CO₂ a kWh, standing charge ${TRACE.gas_sc}p a day. Grid carbon by half-hour.`,
    `<b>Controllers</b>: Fixed 0 °C switch (boiler below 0 °C outside, as hybrids ship today); C-COP (whichever heat is cheaper this half-hour); SD-Power (C-COP, plus the boiler when Britain nears its cap and the house's own random draw falls inside the share SD-Power asks to switch).`,
    `<b>Rooms</b>: the TestbedDT twin of the same house: each room's measured cool-down, radiators from the heat survey, TRVs that close at ${P.target_c} °C. Heated all day by the twin's own control rule (no schedule: comfort is the floor), so the rooms are identical under every controller. The twin needs ${tw0.heatKwh.toFixed(0)} kWh of space heat on ${nice(dt0.date, { day: "numeric", month: "short" })}, the national model ${dt0.heat_kwh.reduce((a, b) => a + b, 0).toFixed(0)} kWh with hot water. Bedroom 3 runs cool under any controller: its measured loss is the highest in the house.`,
    `<b>Britain tonight</b>: national demand plus the heat-pump load of every gas home in Britain run as a hybrid, under C-COP and under SD-Power, from the same national run; the cap is SD-Power's peak.`,
    `<b>Not modelled</b>: cloud (the trace holds none, so the sky is drawn overcast and only diffuse light reaches the glass); the hot-water cylinder is drawn reheating in the two hot-water blocks the national model uses.`,
  ].map(x => `<li>${x}</li>`).join("");
  $("built").textContent = `Built from docs/article/data/trace_${TRACE.weather_year}.json and the TestbedDT parameters of ${P.built}.`;
  $("house-cap").textContent = `Rooms: the twin, held at ${P.target_c} °C all day. Every controller delivers the same heat, so the rooms are the same under all three; only the source changes. Blue: heat pump. Green: boiler.`;

  function fromHash() {
    const k = location.hash === "#kiosk";
    document.body.classList.toggle("kiosk", k);
    if (k) { st.ctl = "sdp"; st.tar = "agile"; $("speed").value = "2"; st.playing = true; setDay(TRACE.order[0]); }
    controls();
  }
  addEventListener("hashchange", fromHash);
  let rz = 0; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { drawLanes(); playhead(st.row); }, 150); });
  fromHash();
  drawLanes(); intro(); paint(true);
  rafId = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
